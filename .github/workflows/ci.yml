name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lawpractice
          POSTGRES_PASSWORD: lawpractice
          POSTGRES_DB: lawpractice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lawpractice" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lawpractice:lawpractice@localhost:5432/lawpractice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lawpractice:ci .
