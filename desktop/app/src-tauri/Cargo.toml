[package]
name = "lawpractice-desktop"
version = "1.0.0"
description = "LawPractice - practice management and trust accounting for law firms"
authors = ["LawPractice"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lawpractice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small binary and low memory use on modest office PCs.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
