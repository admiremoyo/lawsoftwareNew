{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 640px"><div class="card-body p-4">
  <h4>{{ title }}</h4><p class="text-secondary">{{ message }}</p>
  <a class="btn btn-primary" href="/">Go to dashboard</a>
</div></div>
{% endblock %}
{% block public %}
<div class="container" style="max-width: 520px; margin-top: 12vh"><div class="card"><div class="card-body p-4">
  <h4>{{ title }}</h4><p class="text-secondary">{{ message }}</p><a class="btn btn-primary" href="/login/">Sign in</a>
</div></div></div>
{% endblock %}
