{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 900px">
  <div class="card-body">
    <h4 class="mb-3">{{ title }}</h4>
    {% if intro %}<p class="text-secondary">{{ intro }}</p>{% endif %}
    {% include "_form.html" %}
    {% if delete_url %}
      <form method="post" action="{{ delete_url }}" class="mt-3" onsubmit="return confirm('Delete this entry?')">{% csrf_token %}
        <button class="btn btn-sm btn-outline-danger">Delete</button></form>
    {% endif %}
  </div>
</div>
{% endblock %}
