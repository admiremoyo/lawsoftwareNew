{% extends "_auth_card.html" %}
{% block card %}
{% if validlink %}
<h5>Choose a new password</h5>
<form method="post">{% csrf_token %}{% for field in form %}<div class="mb-2">{% include "_field.html" %}</div>{% endfor %}
<button class="btn btn-primary w-100 mt-2">Set password</button></form>
{% else %}<h5>Link expired</h5><p class="text-secondary">This reset link is invalid or has been used. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% endif %}
{% endblock %}
