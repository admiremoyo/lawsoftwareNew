{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<h4>Income and expense categories</h4>
<div class="row g-3">
  <div class="col-md-7"><div class="card"><table class="table table-sm mb-0"><thead><tr><th>Name</th><th>Type</th><th></th></tr></thead>
    <tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.get_kind_display }}</td><td>{% if c.system %}<span class="badge text-bg-light">automatic</span>{% endif %}</td></tr>{% endfor %}</tbody></table></div></div>
  <div class="col-md-5"><div class="card"><div class="card-body"><h6>Add category</h6>{% include "_form.html" %}</div></div></div>
</div>
{% endblock %}
