# One law firm = one copy of this stack (its own database, documents and backups).
#   cp .env.example .env   # then edit it
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawpractice
      POSTGRES_USER: lawpractice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawpractice -d lawpractice"]
      interval: 10s
      retries: 10

  web:
    build: .
    image: lawpractice:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lawpractice:${POSTGRES_PASSWORD}@db:5432/lawpractice
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    # Automatic HTTPS certificates from Let's Encrypt for ${DOMAIN}.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    # Nightly database + documents backup into ./backups, kept for BACKUP_KEEP_DAYS days.
    # Uses the postgres image so pg_dump matches the server version.
    #   Run one now:   docker compose exec backup /deploy/backup.sh
    #   Restore:       docker compose stop web && docker compose exec backup /deploy/restore.sh /backups/<timestamp>
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lawpractice:${POSTGRES_PASSWORD}@db:5432/lawpractice
      BACKUP_HOUR: ${BACKUP_HOUR:-01}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TIME_ZONE:-UTC}
    entrypoint: ["/deploy/backup-loop.sh"]
    volumes:
      - ./deploy:/deploy:ro
      - media:/data/media
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
